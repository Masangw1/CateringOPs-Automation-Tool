<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        background: #f8fafc;
        padding: 16px;
        color: #1e293b;
        margin: 0;
      }
      h3 { margin-bottom: 12px; font-weight: 700; font-size: 18px; }
      .filter-row {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
      }
      .filter-btn {
        flex: 1;
        padding: 6px 10px;
        border: 1.5px solid #cbd5e1;
        background: white;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        color: #475569;
      }
      .filter-btn.active {
        background: #d4a373;
        color: white;
        border-color: #d4a373;
      }
      .dn-item {
        background: white;
        border-left: 4px solid #d4a373;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      }
      .dn-item.signed { border-left-color: #27ae60; }
      .dn-item.sent { border-left-color: #f39c12; }
      .dn-item.draft { border-left-color: #94a3b8; }
      .dn-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .dn-num { font-weight: 700; font-size: 14px; color: #1e293b; }
      .badge {
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
      }
      .badge-signed { background: #dcfce7; color: #166534; }
      .badge-sent { background: #fef9c3; color: #854d0e; }
      .badge-draft { background: #f1f5f9; color: #475569; }
      .dn-detail {
        font-size: 12px;
        color: #64748b;
        margin: 2px 0;
      }
      .dn-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .btn-sm {
        padding: 5px 10px;
        border: none;
        border-radius: 5px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        flex: 1;
      }
      .btn-view {
        background: #1e293b;
        color: white;
      }
      .btn-view:hover { background: #0b1e33; }
      .btn-pdf {
        background: #d4a373;
        color: white;
      }
      .btn-pdf:hover { background: #c4956a; }
      .btn-reset {
        background: #fee2e2;
        color: #991b1b;
      }
      .btn-reset:hover { background: #fecaca; }
      .btn-signature {
        background: #e0f2fe;
        color: #0c4a6e;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #64748b;
        text-align: center;
      }
      .empty {
        text-align: center;
        padding: 30px 10px;
        color: #94a3b8;
        font-size: 13px;
      }
      .loading {
        text-align: center;
        padding: 30px 10px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <h3>📋 Delivery Notes</h3>

    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="Signed">Signed</button>
      <button class="filter-btn" data-filter="Sent">Sent</button>
      <button class="filter-btn" data-filter="Draft">Draft</button>
    </div>

    <div id="listContainer">
      <div class="loading">⏳ Loading...</div>
    </div>
    <div id="status"></div>

    <script>
      var allNotes = [];
      var currentFilter = 'all';

      function loadNotes() {
        google.script.run
          .withSuccessHandler(function(notes) {
            allNotes = notes || [];
            renderList();
          })
          .withFailureHandler(function(err) {
            document.getElementById('listContainer').innerHTML =
              '<div class="empty">Error: ' + err.message + '</div>';
          })
          .getDeliveryNotesList();
      }

      function renderList() {
        var container = document.getElementById('listContainer');
        var filtered = currentFilter === 'all'
          ? allNotes
          : allNotes.filter(function(n) { return n.status === currentFilter; });

        if (filtered.length === 0) {
          container.innerHTML = '<div class="empty">No delivery notes found.</div>';
          return;
        }

        var html = '';
        filtered.forEach(function(n) {
          var cls = 'draft';
          var badgeCls = 'badge-draft';
          if (n.status === 'Signed') { cls = 'signed'; badgeCls = 'badge-signed'; }
          else if (n.status === 'Sent') { cls = 'sent'; badgeCls = 'badge-sent'; }

          html += '<div class="dn-item ' + cls + '">';
          html += '  <div class="dn-header">';
          html += '    <span class="dn-num">' + n.dnNum + '</span>';
          html += '    <span class="badge ' + badgeCls + '">' + n.status + '</span>';
          html += '  </div>';
          html += '  <div class="dn-detail"><strong>Client:</strong> ' + n.clientName + '</div>';
          if (n.quote) html += '  <div class="dn-detail"><strong>Quote:</strong> ' + n.quote + '</div>';
          html += '  <div class="dn-detail"><strong>Date:</strong> ' + n.dateStr + '</div>';
          html += '  <div class="dn-detail"><strong>Total:</strong> MK' + Number(n.total).toFixed(2) + '</div>';
          if (n.signedDateStr) html += '  <div class="dn-detail"><strong>Signed:</strong> ' + n.signedDateStr + '</div>';
          html += '  <div class="dn-actions">';
          html += '    <button class="btn-sm btn-view" onclick="viewPdf(\'' + n.dnNum + '\')">📄 PDF</button>';
          if (n.signatureUrl) {
            html += '    <button class="btn-sm btn-signature" onclick="viewSignature(\'' + n.signatureUrl + '\')">✍️ Signature</button>';
          }
          if (n.status === 'Signed') {
          html += '    <button class="btn-sm btn-reset" onclick="resetStatus(\'' + n.dnNum + '\')">🔄 Reset</button>';
          }
          html += '  </div>';
          html += '</div>';
        });
        container.innerHTML = html;
      }

      function viewPdf(dnNum) {
        document.getElementById('status').textContent = '⏳ Opening PDF...';
        google.script.run
          .withSuccessHandler(function(url) {
            document.getElementById('status').textContent = '';
            window.open(url, '_blank');
          })
          .withFailureHandler(function(err) {
            document.getElementById('status').textContent = 'Error: ' + err.message;
          })
          .getDeliveryNotePDFUrl(dnNum);
      }

      function viewSignature(url) {
        window.open(url, '_blank');
      }

            // Filter buttons
      document.querySelectorAll('.filter-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
          this.classList.add('active');
          currentFilter = this.getAttribute('data-filter');
          renderList();
        });
      });

      function resetStatus(dnNum) {
        if (!confirm('Reset ' + dnNum + ' to Sent status?\n\nThis will clear the signature and regenerate the PDF.')) return;
        google.script.run
          .withSuccessHandler(function(msg) { alert('✅ ' + msg); location.reload(); })
          .withFailureHandler(function(err) { alert('❌ Error: ' + err.message); })
          .resetDeliveryNoteStatus(dnNum);
      }

      function initPage() {
        loadNotes();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initPage);
      } else {
        initPage();
      }
    </script>
  </body>
</html>
