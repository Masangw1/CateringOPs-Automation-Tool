<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap');
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', sans-serif;
        background: #f6f8fa;
        padding: 24px 16px;
        color: #1e293b;
        line-height: 1.5;
      }
      .container { max-width: 480px; margin: 0 auto; }

      .app-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 2px solid #e9edf2;
      }
      .app-header .logo-fallback {
        width: 48px;
        height: 48px;
        background: #d4a373;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 28px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .logo-img { height: 48px; width: auto; border-radius: 8px; display: none; }
      .app-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; color: #0b1e33; }
      .app-header .sub { font-size: 13px; font-weight: 400; color: #64748b; margin-top: 2px; }

      .form-group { margin-bottom: 18px; }
      label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 5px;
        color: #1e293b;
      }
      select, input {
        width: 100%;
        padding: 10px 12px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        border: 1.5px solid #d1d5db;
        border-radius: 8px;
        background: white;
        transition: border 0.2s, box-shadow 0.2s;
      }
      select:focus, input:focus {
        outline: none;
        border-color: #d4a373;
        box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.2);
      }
      .info-text { font-size: 12px; color: #64748b; margin-top: 4px; }

      .btn {
        display: inline-block;
        padding: 12px 20px;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.25s;
        width: 100%;
        text-align: center;
      }
      .btn-primary {
        background: linear-gradient(145deg, #d4a373, #c4956a);
        color: white;
        box-shadow: 0 4px 12px rgba(212, 163, 115, 0.35);
      }
      .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 163, 115, 0.45); }
      .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

      #result {
        margin-top: 16px;
        padding: 14px 18px;
        border-radius: 10px;
        display: none;
        font-weight: 500;
      }
      .success { display: block !important; background: #dcfce7; color: #166534; border: 1px solid #86efac; }
      .error { display: block !important; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
      .loading { display: block !important; background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
      .pdf-link { color: #1e40af; font-weight: 600; text-decoration: none; }
      .pdf-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="app-header">
        <div id="logoFallback" class="logo-fallback">📧</div>
        <img id="headerLogo" class="logo-img" src="" alt="Company Logo">
        <div>
          <h1>Send Quote</h1>
          <div class="sub">Crystal Caterers &amp; Events</div>
        </div>
      </div>

      <div class="form-group">
        <label for="quoteSelect">Select Quote</label>
        <select id="quoteSelect"><option value="">Loading quotes...</option></select>
        <div class="info-text">Select a quote to email to the client.</div>
      </div>

      <div class="form-group">
        <label for="emailInput">Recipient Email (optional)</label>
        <input type="email" id="emailInput" placeholder="name@example.com">
        <div class="info-text">Leave blank to use the focal person's email or the client's email.</div>
      </div>

      <button id="sendBtn" class="btn btn-primary">📤 Send Quote via Email</button>
      <div id="result"></div>
    </div>

    <script>
      function loadLogo() {
        google.script.run
          .withSuccessHandler(function(base64) {
            if (base64 && base64 !== '') {
              var img = document.getElementById('headerLogo');
              img.src = base64;
              img.style.display = 'block';
              var fallback = document.getElementById('logoFallback');
              if (fallback) fallback.style.display = 'none';
            }
          })
          .withFailureHandler(function(err) { console.warn('Logo load failed:', err); })
          .getLogoBase64();
      }

      function showMessage(message, type) {
        var resultDiv = document.getElementById('result');
        resultDiv.innerHTML = message;
        resultDiv.className = type || 'loading';
        resultDiv.style.display = 'block';
      }

      function loadQuotes() {
        var select = document.getElementById('quoteSelect');
        select.innerHTML = '<option value="">Loading quotes...</option>';
        google.script.run
          .withSuccessHandler(function(quotes) {
            select.innerHTML = '';
            if (quotes && quotes.length > 0) {
              var def = document.createElement('option');
              def.value = '';
              def.text = '-- Select a quote --';
              select.appendChild(def);
              quotes.forEach(function(q) {
                var opt = document.createElement('option');
                opt.value = q;
                opt.text = q;
                select.appendChild(opt);
              });
            } else {
              var opt = document.createElement('option');
              opt.value = '';
              opt.text = 'No quotes found';
              select.appendChild(opt);
            }
          })
          .withFailureHandler(function(error) {
            select.innerHTML = '<option value="">Error loading quotes</option>';
            showMessage('Error loading quotes: ' + error.message, 'error');
          })
          .getQuoteList();
      }

      function initPage() {
        loadLogo();
        loadQuotes();

        var sendBtn = document.getElementById('sendBtn');
        if (sendBtn) {
          sendBtn.addEventListener('click', function() {
            var quoteNumber = document.getElementById('quoteSelect').value;
            var email = document.getElementById('emailInput').value.trim();
            var btn = this;

            if (!quoteNumber) {
              showMessage('⚠️ Please select a quote.', 'error');
              return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending...';
            showMessage('⏳ Sending quote...', 'loading');

            google.script.run
              .withSuccessHandler(function(result) {
                var message = '✅ <strong>Quote sent successfully!</strong><br>';
                message += '📧 To: ' + result.clientEmail + '<br>';
                message += '👤 Client: ' + result.clientName + '<br>';
                message += '📎 <a href="' + result.pdfUrl + '" target="_blank" class="pdf-link">View PDF</a>';
                showMessage(message, 'success');
                btn.disabled = false;
                btn.textContent = '📤 Send Quote via Email';
              })
              .withFailureHandler(function(error) {
                showMessage('❌ Error: ' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = '📤 Send Quote via Email';
              })
              .sendQuotePDF(quoteNumber);
          });
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initPage);
      } else {
        initPage();
      }
    </script>
  </body>
</html>
