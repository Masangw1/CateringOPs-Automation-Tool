<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: 'Inter', Arial, sans-serif; padding: 20px; background: #f9f9f9; max-width: 350px; margin: 0 auto; color: #1e293b; }
      h3 { color: #2c3e50; border-bottom: 2px solid #d4a373; padding-bottom: 10px; margin-top: 0; }
      .form-group { margin-bottom: 15px; }
      label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; color: #333; }
      select { width: 100%; padding: 8px 10px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 14px; background: white; }
      .btn { background: linear-gradient(145deg, #d4a373, #c4956a); color: white; padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: 600; transition: all 0.25s; }
      .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 163, 115, 0.45); }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
      #result { margin-top: 15px; padding: 10px 14px; border-radius: 8px; display: none; font-weight: 500; font-size: 14px; }
      .success { display: block !important; background: #dcfce7; color: #166534; border: 1px solid #86efac; }
      .error { display: block !important; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
      .loading { display: block !important; background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
      .pdf-link { display: inline-block; margin-top: 8px; color: #1e40af; font-weight: 600; text-decoration: none; }
      .pdf-link:hover { text-decoration: underline; }
      .info-text { font-size: 12px; color: #64748b; margin-top: 4px; }
    </style>
  </head>
  <body>
    <h3>📧 Send Quote PDF</h3>
    <div class="form-group">
      <label for="quoteSelect">Select Quote</label>
      <select id="quoteSelect"><option value="">Loading...</option></select>
      <div class="info-text">Select a quote to send via email</div>
    </div>
    <button id="sendBtn" class="btn">📤 Send Quote via Email</button>
    <div id="result"></div>

    <script>
      function loadQuotes() {
        console.log('loadQuotes called');
        var select = document.getElementById('quoteSelect');
        if (!select) {
          console.error('quoteSelect element not found!');
          return;
        }
        select.innerHTML = '<option value="">Loading quotes...</option>';
        google.script.run
          .withSuccessHandler(function(quotes) {
            console.log('Quotes loaded:', quotes);
            select.innerHTML = '';
            if (quotes && quotes.length > 0) {
              var defaultOption = document.createElement('option');
              defaultOption.value = '';
              defaultOption.text = '-- Select a quote --';
              select.appendChild(defaultOption);
              quotes.forEach(function(quote) {
                var option = document.createElement('option');
                option.value = quote;
                option.text = quote;
                select.appendChild(option);
              });
            } else {
              var option = document.createElement('option');
              option.value = '';
              option.text = 'No quotes found';
              select.appendChild(option);
            }
          })
          .withFailureHandler(function(error) {
            console.error('Error loading quotes:', error);
            select.innerHTML = '<option value="">Error loading quotes</option>';
          })
          .getQuoteList();
      }

      function showMessage(message, type) {
        var resultDiv = document.getElementById('result');
        resultDiv.innerHTML = message;
        resultDiv.className = type || 'loading';
        resultDiv.style.display = 'block';
      }

      document.getElementById('sendBtn').addEventListener('click', function() {
        var quoteNumber = document.getElementById('quoteSelect').value;
        var sendBtn = this;
        if (!quoteNumber) {
          showMessage('⚠️ Please select a quote.', 'error');
          return;
        }
        sendBtn.disabled = true;
        sendBtn.textContent = 'Sending...';
        showMessage('⏳ Sending quote...', 'loading');
        google.script.run
          .withSuccessHandler(function(result) {
            var message = '✅ <strong>Quote sent successfully!</strong><br>';
            message += '📧 To: ' + result.clientEmail + '<br>';
            message += '👤 Client: ' + result.clientName + '<br>';
            message += '📎 <a href="' + result.pdfUrl + '" target="_blank" class="pdf-link">View PDF</a>';
            showMessage(message, 'success');
            sendBtn.disabled = false;
            sendBtn.textContent = '📤 Send Quote via Email';
          })
          .withFailureHandler(function(error) {
            showMessage('❌ Error: ' + error.message, 'error');
            sendBtn.disabled = false;
            sendBtn.textContent = '📤 Send Quote via Email';
          })
          .sendQuotePDF(quoteNumber);
      });

      // ---- Immediate load ----
      loadQuotes();
    </script>
  </body>
</html>
